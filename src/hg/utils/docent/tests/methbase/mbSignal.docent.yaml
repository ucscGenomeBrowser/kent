# The four MethBase rows a fresh connect draws really contain data, checked in the one
# place a text assertion cannot reach: the pixels.
#
# WHY THIS NEEDS A COLOR CHECK.  Every one of these rows is served from
# smithlab.usc.edu over http, by range request, at render time.  When one of those files
# stops answering, hgTracks does not drop the row and does not put a message on the page:
# it catches the abort into networkErrMsg and paints the row as a pale yellow bar,
# 240,240,180 (undefinedYellowColor, hg/hgTracks/simpleTracks.c), with the text inside the
# png.  Same row name, same height, same map boxes.  `rows:` passes, `text:` and `noText:`
# pass, and the only thing that differs is the color.  This is the rm38310 lesson applied
# to a remote hub, where the failure is not a bug in our code but a file that moved.
#
# The colors are the hub's own, one per data type, and each one is stated by the hub's
# trackDb rather than picked here:
#
#   asm    255,64,64    allele-specific methylation, averaged over every sample
#   cpgs   0,0,0        CpG positions
#   sym    255,153,0    CpG methylation level for one experiment
#   HMR    56,113,193   hypomethylated regions for that experiment
#
# THE POSITION IS PART OF THE TEST.  chr15:24,950,000-24,960,000 is the SNRPN imprinted
# locus at 15q11.2, where MethBase carries an HMR (chr15:24,954,017-24,958,266 in sperm)
# and the ASM signal is high.  A window with no methylation data would draw white rows and
# `is:` would report the row's black label instead, so a green run would say nothing.
# mbZoomOut is the same four rows at chromosome scale, where the summary levels of the
# same files are what answer.

target: rr
db: hg38
position: chr15:24950000-24960000
reset: true
fast: true
steps:
  - go: chr15:24950000-24960000
  - hide: all
  - hub: {url: "http://smithlab.usc.edu/trackdata/methylation/hub.txt", db: hg38}
  - go: chr15:24950000-24960000
  - expect: {rows: [asm, cpgs, SRP007400_SRX081759_sym, SRP007400_SRX081759_HMR]}

  # `is:` states the row drew its own data.  `not:` states it is not the warning bar, and
  # is kept even though `is:` already implies it, because a failure then prints both and
  # says which of the two happened.
  - expect:
      color:
        - {track: asm,                     is: "255,64,64",   not: "240,240,180"}
        - {track: cpgs,                    is: "0,0,0",       not: "240,240,180"}
        - {track: SRP007400_SRX081759_sym, is: "255,153,0",   not: "240,240,180"}
        - {track: SRP007400_SRX081759_HMR, is: "56,113,193",  not: "240,240,180"}
