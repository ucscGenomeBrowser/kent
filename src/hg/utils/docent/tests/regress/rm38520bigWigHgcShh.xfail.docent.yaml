# #38520 -- a quickLifted bigWig (hg19 gc5BaseBw lifted onto hg38).
# Before the change the details page queried the hg19 file at the hg38 position, so it
# reported the values of some other stretch of sequence.  Now it reads each source range
# through the chain and says "Lifted from: hg19".
#
# hgc, '+' strand:  over hg38 chr7:155,799,307-155,811,306 the click reports 2,400 items,
# mean 59.275, standard deviation 24.6825:  exactly the native hg19 click over hg19
# chr7:155,592,001-155,604,000.  The old page said mean 40.2999.
proof:
  - "xfail 2026-10-09 -- fails on genome-test (master): master's page, which reads the hg19 file at the hg38 position"
  - "sandbox-ab 2026-10-09 -- passes on park 38520, port 48112 (branch quickLiftWig 8740124b45b)"

target: genome-test
db: hg19
position: chr7:155592001-155604000
reset: true
fast: true
steps:
  - go: chr7:155592001-155604000
  - hide: all
  - track: {gc5BaseBw: full}
  - expect: {rows: [gc5BaseBw], noText: "Warning/Error"}
  - convert: {to: hg38, quicklift: true, hideDefaults: true}
  - open: lift
  - go: chr7:155799307-155811306
  - expect: {rows: [gc5BaseBw], noText: "Warning/Error"}
  - click: {track: gc5BaseBw, frac: 0.5}
  - expect:
      url: "hgc"
      text: ["Lifted from:", "hg19", "2,400", "59.275", "24.6825"]
      noText: ["40.2999", "Warning/Error"]
