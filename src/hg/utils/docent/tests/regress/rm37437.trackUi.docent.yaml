# #37437 -- the configuration page of a quickLifted RepeatMasker track:  rmsk, RepeatMasker
# Viz. (rmskJoined) and bigRmsk.
#
# hgTrackUi itself did not change for #37437.  What changed is that these tracks can now be
# quickLifted at all (rmsk and bigRmsk), or lifted as what they are rather than as a plain bed
# (Viz.), so this is the first time each one reaches hgTrackUi as a lifted hub track.  Its
# name then carries a hub prefix, its description comes from the source assembly through
# getTrackHtml() in hg/lib/hui.c, and its type's controls are read under the prefixed name.
# The script reaches each page the way a user does, by clicking the track's name in the
# track controls under the image.  The right-click Configure entry opens only the controls,
# in a dialog, without the description or the Remove from QuickLift link.
#
# What is asserted, per kind:  the page opens without an error, shows the type's own controls
# (the class color override for rmsk, the two subtrack checkboxes for Viz., the four bigRmsk
# options), the description borrowed from the source assembly, and the Remove from QuickLift
# link that only a lifted track gets.  The controls are matched by the end of their names,
# since the hub prefix changes from run to run.
#
# GATE: browser.quickLiftRmsk, off by default, a cart variable as well as an hg.conf setting,
# so the script turns it on for itself.  With it off rmsk and bigRmsk never reach the hub and
# the right clicks fail.
#   grep browser.quickLiftRmsk /usr/local/apache/cgi-bin/hg.conf
proof:
  - "assertion-only 2026-10-19 -- written with the change, on branch qlRmsk37437"
  - "xfail 2026-10-19 -- fails on genome-test (master without #37437) at step 6: the lifted rmsk row is not drawn, so the configuration page is never reached"
  - "sandbox-ab 2026-10-19 -- park 37437: passes with the branch binaries and fails at step 6 with master's.  hgTrackUi is the same binary in both, so this shows the page is reachable only with the change; the hgTrackUi checks themselves have not been seen to fail"
  - "server-flip 2026-10-20 -- passes on genome-test since #37437 was pushed and installed there (cgi-alpha 15:29), having failed there as an xfail on 2026-10-19"

target: genome-test
db: hg19
position: chr7:155590000-155610000
reset: true
fast: true
steps:
  # rmsk:  hg19 onto hg38
  - goto: "/cgi-bin/hgTracks?db=hg19&position=chr7%3A155590000-155610000&pix=1100&browser.quickLiftRmsk=on"
  - hide: all
  - track: {rmsk: full}
  - convert: {to: hg38, quicklift: true, hideDefaults: true}
  - open: lift
  - expect: {rows: [rmsk], noText: "Warning/Error"}
  - click: 'a.trackLink[data-track$="_rmsk"]'
  - expect:
      url: "hgTrackUi"
      text: ["Remove from QuickLift", "Display Conventions and Configuration",
             "Interspersed repeats and other mementos of transposable elements"]
      has: ['input[name$="_rmsk.colorOverrideOn"]']
      noText: ["Warning/Error", "No description found"]

  # RepeatMasker Viz.:  hg38 onto hg19
  - goto: "/cgi-bin/hgTracks?db=hg38&position=chr1%3A206170000-206190000&pix=1100&browser.quickLiftRmsk=on"
  - hide: all
  - track: {rmskJoinedCurrent: full}
  - convert: {to: hg19, quicklift: true, hideDefaults: true}
  - open: lift
  - expect: {rows: [rmskJoinedCurrent], noText: "Warning/Error"}
  - click: 'a.trackLink[data-track$="_joinedRmsk"]'
  - expect:
      url: "hgTrackUi"
      text: ["Remove from QuickLift", "RepeatMasker v4.0.7 Dfam_2.0 : Current Dataset",
             "Data are generated using the RepeatMasker"]
      has: ['input[name$="_rmskJoinedCurrent_sel"]', 'input[name$="_rmskJoinedBaseline_sel"]']
      noText: ["Warning/Error", "No description found"]

  # bigRmsk:  hs1 onto hg38
  - goto: "/cgi-bin/hgTracks?db=hs1&position=chr1%3A147283027-147308038&pix=1100&browser.quickLiftRmsk=on"
  - hide: all
  - track: {t2tRepeatMasker: full}
  - convert: {to: hg38, quicklift: true, hideDefaults: true}
  - open: lift
  - expect: {rows: [t2tRepeatMasker], noText: "Warning/Error"}
  - click: 'a.trackLink[data-track$="_t2tRepeatMasker"]'
  - expect:
      url: "hgTrackUi"
      text: ["Remove from QuickLift", "Display Conventions and Configuration",
             "Interspersed repeats and other mementos of transposable elements"]
      has: ['input[name="bigrmsk.showUnalignedExtents"]', 'input[name="bigrmsk.showLabels"]',
            'input[name="bigrmsk.origPackViz"]', 'input[name="bigrmsk.regexpFilter"]']
      noText: ["Warning/Error", "No description found"]
