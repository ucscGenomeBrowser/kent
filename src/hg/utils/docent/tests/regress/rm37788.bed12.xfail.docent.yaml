# #37788 -- Example 4, BED12: two blocks on chr22 and two on chr21, hg38, with the genes
# POTEH, CECR2, USP25 and CHODL.
#
# One of five scripts, one per example on multiRegionHelp.html, so that each example can
# be timed and pixel-compared on its own between genome-test and a build of the
# multiviewQuickLift branch.  Each loads the help page's own session file from
# genome.ucsc.edu, which is the link a user clicks on that page, and asserts what the
# example's text says the user will see.
#
# The checks are the region boxes and the gene names, not the full list of rows.  On the
# branch a multi-region view is a synthetic assembly, and it hides tracks that quickLift
# cannot carry (rmsk, phyloP100way and others), so `exact: true` would fail there for a
# reason this script does not watch.  Each region of the view gets a map box whose
# data-tooltip is its source range, so `area[data-tooltip="chrN:a-b"]` is present only
# when that region really is in the view.  noText is the warning the branch prints when
# a saved position cannot be placed in the view.
#
# The branch needs `multiRegionSpaces=on` in hg.conf.  With it off the branch takes the
# old virtual-chromosome path, and the script then tests that path instead.
#
# XFAIL.  The help page says the view shows four regions, two on chr22 and two on chr21.
# genome-test AND genome.ucsc.edu (checked 2026-10-06) build all four:  the virtual
# chromosome is 283,981 bp, and position=multi:1-283981 draws them.  But they open the
# session on multi:1-112,554, the chr22 half, and not on the saved virt:1-283981, so
# USP25, CHODL and the chr21 region boxes are off screen.  This is in the shipped code.
# demo6 with the gate on draws all four (checked 2026-10-06, the branch's virt: position
# fix on top of a41191def6b), so this script flips when the branch reaches genome-test.
proof:
  - "xfail 2026-10-06 -- written from multiRegionHelp.html; fails on genome-test for the chr21 regions, passes on demo6, see above"

target: genome-test
db: hg38
reset: true
fast: true
size: [1400, 900]
steps:
  - loadSession: https://genome.ucsc.edu/goldenPath/help/examples/sessions/bed12Session.txt
  - expect:
      rows: [ruler, knownGene]
      noText: "is not in this multi-region view"
      has:
        - '#hgTracksConfigMultiRegionPage.pressed'
        - 'area[data-tooltip="chr22:15690027-15721523"]'
        - 'area[data-tooltip="chr22:17477093-17558149"]'
        - 'area[data-tooltip="chr21:15730026-15878912"]'
        - 'area[data-tooltip="chr21:18244834-18267373"]'
        - 'area[data-tooltip*="POTEH"]'
        - 'area[data-tooltip*="CECR2"]'
        - 'area[data-tooltip*="USP25"]'
        - 'area[data-tooltip*="CHODL"]'
  - shot: bed12
