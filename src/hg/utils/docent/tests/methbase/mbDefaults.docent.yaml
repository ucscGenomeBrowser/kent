# MethBase2, attached by URL to a cleared cart: what a user gets before touching anything.
#
# This is the canary of the directory.  The hub carries 511 study composites on hg38 and
# 33,270 tracks in all, and exactly three of the 511 are not `visibility hide`: `common`,
# `SRP007400` and `SRP008144`.  That is a deliberate choice by the hub's authors, and it
# is the only thing standing between a user who clicks Connect and a page with thousands
# of rows on it.  So the assertion is `exact: true` over the whole set.
#
# It follows that a hub update which adds a default-on study, or adds an experiment to one
# of the two, turns this red.  That is intended, and it is why the other seven hg38
# scripts here name only the rows they care about: an added study should not make the
# whole directory shout.  Read the `drawn:` list in the failure before changing anything;
# it says what the hub now comes up with, which is the news.  (mbMouse and mbLegacy use
# `exact: true` as well, over sets that cannot move the same way: one mm39 study, and a
# hub that is frozen.)
#
# `ruler` is in the list because `exact:` counts it.  A set without it fails with
# `unexpected rows: ruler`, which reads like a bug in the hub and is not one.
#
# `hide: all` before the hub, not after.  A cleared cart still has the hg38 default tracks
# in it, and the hub's own rows are then indistinguishable from them in `exact:`.  The
# order matters the other way too: `reset:` clears connected hubs, so the attach has to
# come after it (see the docent skill).
#
# cpgs is in the list even though the hub says `visibility hide` for it.  A composite's
# visibility reaches its subtracks -- `common` is `visibility full` -- so the subtrack
# line is its own default and not what decides this.  mm39 behaves the same way; see
# mbMouse.

target: rr
db: hg38
position: chr15:24950000-24960000
reset: true
fast: true
steps:
  - go: chr15:24950000-24960000
  - hide: all
  - hub: {url: "http://smithlab.usc.edu/trackdata/methylation/hub.txt", db: hg38}
  - go: chr15:24950000-24960000

  # The two `common` tracks, then SRP007400 (3 experiments) and SRP008144 (7), each with
  # its sym and HMR views.  Nothing from the other 509 studies, and none of the three
  # views the hub hides: AMR, PMD and CpG reads.
  - expect:
      rows: [ruler, asm, cpgs,
             SRP007400_SRX081759_sym, SRP007400_SRX081759_HMR,
             SRP007400_SRX081760_sym, SRP007400_SRX081760_HMR,
             SRP007400_SRX081761_sym, SRP007400_SRX081761_HMR,
             SRP008144_SRX096518_sym, SRP008144_SRX096518_HMR,
             SRP008144_SRX096519_sym, SRP008144_SRX096519_HMR,
             SRP008144_SRX096520_sym, SRP008144_SRX096520_HMR,
             SRP008144_SRX096521_sym, SRP008144_SRX096521_HMR,
             SRP008144_SRX096522_sym, SRP008144_SRX096522_HMR,
             SRP008144_SRX096523_sym, SRP008144_SRX096523_HMR,
             SRP008144_SRX096524_sym, SRP008144_SRX096524_HMR]
      exact: true
      noText: "Too Long"

  # Said again as a height, because `exact:` is a set and says nothing about how tall the
  # rows are.  A superTrack that came up whole would be tens of thousands of pixels.
  - expect: {height: "<1200"}
