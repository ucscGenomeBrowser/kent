# #17412 -- "virt nomenclature persists when virt is not onscreen in Multi-Region mode".
# Bob Kuhn substituted an alt haplotype into hg38 (multi-region, singleAltHaplo mode),
# then typed a position on another chromosome.  The coordinates still read "virt:...".
# In his follow-up note he narrowed the complaint: keeping the virtual name is fine, but
# when he copied that virt: text into the position box and pressed go, nothing happened.
# Jairo closed it in 2023 as no longer an issue.
#
# The virtual chromosome is now called "multi", not "virt".  With multiRegionSpaces on
# (#37788) the alt view holds only the chromosome the alt is placed on, with the alt
# spliced in.  The old view was the whole genome with one alt swapped in, and that is
# wider than a space can be.  So a position typed on another chromosome now leaves the alt
# view and goes there, which settles the first half of the ticket:  the display reads
# chr17, not a multi: range.
#
# Checks:
#   step 1  the alt view really loaded: the Multi-region button is pressed and the alt
#           sequence has its own region box.  Without this step the rest of the script
#           could pass on a server that ignored singleAltHaplo.
#   step 2  the move to chr17:43044295-43125483 really happens: the ideogram is chr17's
#           (a cytoBand map box names chr17), knownGene is drawn, and the view has left
#           multi-region, so the button is not pressed.  noText is the warning an earlier
#           space build printed when it refused the move.
#   step 3  back into the alt view.
#   step 4  the half Bob settled on: a multi: position typed into the box and submitted
#           works.  multi:1-100000 is the start of the alt view, which the display names
#           as chr1:1-100,000, and the view stays multi-region.  The alt view holds two
#           sequences, so it draws no ideogram to check instead.
#
# Before the #37788 fix of 2026-11-10 step 2 failed on genome-test with
# "chr17:43044295-43125483 is not in this multi-region view."
proof:
  - "assertion-only 2026-10-06 -- written from the ticket"
  - "assertion-only 2026-11-10 -- rewritten for the space path:  a position on another chromosome leaves the alt view"

target: genome-test
db: hg38
reset: true
fast: true
steps:
  - goto: "/cgi-bin/hgTracks?db=hg38&position=chr1%3A2094367-3145714&virtModeType=singleAltHaplo&singleAltHaploId=chr1_KI270762v1_alt&pix=1100&hideTracks=1&knownGene=pack"
  - expect:
      rows: [ruler, knownGene]
      has:
        - '#hgTracksConfigMultiRegionPage.pressed'
        - 'area[data-tooltip="chr1_KI270762v1_alt:1-354444"]'

  - goto: "/cgi-bin/hgTracks?position=chr17%3A43044295-43125483"
  - expect:
      rows: [ruler, knownGene]
      noText: "is not in this multi-region view"
      has: 'area.cytoBand[data-tooltip*="chr17:"]'
      noHas: '#hgTracksConfigMultiRegionPage.pressed'

  - goto: "/cgi-bin/hgTracks?position=chr1%3A2094367-3145714&virtModeType=singleAltHaplo&singleAltHaploId=chr1_KI270762v1_alt"
  - expect:
      has: '#hgTracksConfigMultiRegionPage.pressed'

  - goShow: "multi:1-100000"
  - expect:
      rows: [ruler, knownGene]
      text: "chr1:1-100,000"
      has: '#hgTracksConfigMultiRegionPage.pressed'
