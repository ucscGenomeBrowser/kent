# #38591 -- a quickLifted bed track kept items that lift outside the window, and its hgc page
# showed the wrong item.
#
# Fixes on branch qlFixes:  d5c25811256 (quickLiftSqlLoadBeds() in hg/lib/quickLift.c keeps
# only beds that overlap the window) and 72e95deee47 (genericBedClick() in hg/hgc/hgc.c
# prints the lifted bed that was clicked, not the first one in the list).
#
# quickLift reads chains for a window padded by 100 kb, so items lift to places off screen.
# hg19 chr1:1,000,000-1,100,000 lifted to hg38 is chr1:1,064,620-1,164,620.  CpG Islands
# in full there:
#   * The window check.  Before the fix 30 items get map boxes, 15 of them past the window
#     end (chr1:1,206,290-1,255,419 and on), and the page warns "mapItem ... spills over
#     track bounds".  The check is the warning text, plus noHas: on the box of the item at
#     o=1206290, past the window end, plus has: on the in-window CpG: 151 at o=1115798 so an
#     empty row cannot pass.  Pack mode shows none of this, so the track is full.
#   * The click check.  CpG: 151 is the third item in the window.  Before 72e95deee47 hgc
#     printed the first lifted bed:  CpG: 615 at chr1:958934-967274 on master, and CpG: 213
#     with only the window fix.  Now it prints CpG: 151 at chr1:1115799-1117065.
#
# Not asserted:  the narrowPeak/broadPeak half of d5c25811256 (encode.c), which needs a peak
# track near a window edge;  and the count of items, which a cpgIslandExt reload could move.
proof:
  - "assertion-only 2026-10-20 -- written with the fix"
  - "xfail 2026-10-20 -- fails on genome-test at step 7:  page contains \"spills over track bounds\", 2 boxes match o=1206290;  until qlFixes is pushed and built there"
  - "sandbox-ab 2026-10-20 -- park 38591 (port 48116):  passes with qlFixes at 9e6f2de0564;  with hgc.c and trackHub.c from 994159225dd it fails at step 9 (hgc page shows CpG: 213, not chr1:1115799-1117065)"

target: genome-test
db: hg19
position: chr1:1000000-1100000
reset: true
fast: true
steps:
  - go: chr1:1000000-1100000
  - hide: all
  - track: {cpgIslandExt: full}
  - expect: {rows: [cpgIslandExt], noText: "Warning/Error"}

  - convert: {to: hg38, quicklift: true, hideDefaults: true}
  - open: lift
  - expect:
      rows: [quickLiftChain, cpgIslandExt]
      has: 'area[href*="o=1115798&"]'
      noHas: 'area[href*="o=1206290&"]'
      noText: ["spills over track bounds"]

  - click: {track: cpgIslandExt, item: "CpG: 151"}
  - expect:
      url: "hgc"
      text: ["CpG: 151", "chr1:1115799-1117065"]
      noText: ["CpG: 213", "CpG: 615"]
