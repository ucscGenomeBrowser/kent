# #16891 -- MAF custom tracks broken in multi-region.  Matt Speir, 2016-02-25: after
# entering exon-only mode ("e v"), half of the MAF data around SOD1 disappeared, the left
# labels did not line up, and after zooming out and scrolling all the MAF data was gone.
# Christopher Lee added the gene-only case: enter gene-only view, zoom out 1.5x, and the
# custom track disappears.  Hibernating since 2025-02-21; Lou said in 2023 it was still a
# bug.
#
# Matt's session is gone, so the fixture is our own: hg19 multiz100way over SOD1
# (chr21:33,031,900-33,041,300), cut down to five species with mafFetch and
# mafSpeciesSubset, loaded as a type=maf custom track named rm16891maf.  The custom track
# is loaded in a second request, because hideTracks=1 in the same request hides it too.
#
# With multiRegionSpaces on (#37788), multi-region view is a synthetic assembly and every
# track is lifted into it with quickLift.  quickLift cannot carry a maf custom track, so
# in exon-only and gene-only view the MAF row holds one grey line instead, "maf tracks
# cannot be shown in multi-region view".  The custom track no longer disappears, which
# was Christopher's symptom, and it no longer draws half its data, which was Matt's.
#
# What this asserts: the MAF row is drawn at its full five-species height (75px) in the
# single-region view, and in exon-only view, after a zoom out, in gene-only view, and
# after a zoom out there, the row is still on the page as the one-line note (34px).  A
# custom track's row id carries a per-run number, so it is matched as
# td_data_ct_rm16891maf*.  The note itself is drawn into the image, where no check can
# read it.
proof:
  - "assertion-only 2026-10-06 -- written from the ticket"
  - "assertion-only 2026-11-10 -- multi-region steps now expect the one-line note row of a space"

target: genome-test
db: hg19
position: chr21:33031900-33041300
reset: true
fast: true
steps:
  - goto: "/cgi-bin/hgTracks?db=hg19&position=chr21%3A33031900-33041300&pix=1100&hideTracks=1&knownGene=pack"
  - goto: "/cgi-bin/hgTracks?hgt.customText=https%3A%2F%2Fhgwdev.gi.ucsc.edu%2F~braney%2FdocentFixtures%2FmrBugs%2F16891%2Frm16891maf.ct.txt"
  - expect:
      rows: [ruler, knownGene]
      has: 'img[id^="img_data_ct_rm16891maf"]'
      box: {sel: '[id^="td_data_ct_rm16891maf"]', height: '>=70'}

  - goto: "/cgi-bin/hgTracks?pix=1100&virtModeType=exonMostly"
  - expect:
      has: ['#hgTracksConfigMultiRegionPage.pressed', 'img[id^="img_data_ct_rm16891maf"]']
      box: {sel: '[id^="td_data_ct_rm16891maf"]', height: '<=40'}
  - zoom: out
  - expect:
      has: ['#hgTracksConfigMultiRegionPage.pressed', 'img[id^="img_data_ct_rm16891maf"]']
      box: {sel: '[id^="td_data_ct_rm16891maf"]', height: '<=40'}

  - goto: "/cgi-bin/hgTracks?pix=1100&virtModeType=geneMostly"
  - expect:
      has: ['#hgTracksConfigMultiRegionPage.pressed', 'img[id^="img_data_ct_rm16891maf"]']
      box: {sel: '[id^="td_data_ct_rm16891maf"]', height: '<=40'}
  - zoom: out
  - expect:
      has: ['#hgTracksConfigMultiRegionPage.pressed', 'img[id^="img_data_ct_rm16891maf"]']
      box: {sel: '[id^="td_data_ct_rm16891maf"]', height: '<=40'}
