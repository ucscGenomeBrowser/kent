# #37388 -- clicking an item in a QuickLifted hub track sent hgc looking for a MySQL
# database named after the source assembly:
#
#     Couldn't set connection database to GCA_018466835.2
#
# The state is hg38 at chrM with a quickLift hub active, its chain from GCA_018466835.2, and
# an xenoRefGene track from that hub.  It used to come from the saved session braney/crash1,
# which only genome-test could load, so it is built in steps now; see the first steps.
#
# click: {track:, item:} follows the item's own map-box link, which is how hgc is reached.
# A raw click on the image is swallowed by hgTracks' drag-select handler.
proof:
  - "assertion-only 2026-09-04 -- written from the ticket after the fix had shipped"

target: genome-test
db: hg38
reset: true
fast: true
steps:
  # The lifted view is built in steps, not loaded from a session.  A quickLift session names
  # its hub by a path on the server that made it, and re-pointing it does not work (#38046),
  # so braney/crash1 ran only on genome-test.  These steps run on any server.  They lift the
  # mitochondrion of GenArk GCA_018466835.2 to hg38, the state crash1 held.
  - goto: "/cgi-bin/hgTracks?db=GCA_018466835.2&position=chrMT_JAGYVI020000079v1_random:1-16566&pix=1100"
  - expect: {rows: [xenoRefGene]}
  - goto: "/cgi-bin/hgConvert?db=GCA_018466835.2&position=chrMT_JAGYVI020000079v1_random:1-16566&hglft_toOrg=Human&hglft_toDb=hg38&doQuickLift=on&hglft_doConvert=submit"
  - click: 'a[href*="hgTracks?"][href*="quickLift."]'
  - expect: {rows: [xenoRefGene], text: "chrM"}

  - click: {track: xenoRefGene, item: "NM_126741.2"}

  # hgc has no track image, so there is no row to assert on here: the whole check is that
  # the page is the details page and not the early-error page the bug produced.
  - expect: {noText: "Couldn't set connection database"}
