# #38317 -- a knownGene details page printed an OMIM link built from uninitialised memory,
# and further down the same struct crashed the page.
#
# doKnownGene builds a `struct refLink` on the stack and fills in three of its eight fields.
# A struct declared that way is not zeroed, so the other five hold whatever the stack last
# held. Two of them are then read: prKnownGeneInfo tests rl->omimId and prints an OMIM link
# with that number in it, and geneShowPosAndLinksPal hands rl->protAcc to hGenBankHaveSeq as
# a string. a1c0911798f zeroes the struct and checks the protein accession for null, since a
# null string reaching sqlSafef aborts.
#
# THE OMIM LINK IS THE WRONG THING TO TEST FOR. It is whatever was on the stack, so it comes
# and goes between loads of the same URL: QA counted it on 1 of 10 loads of the hg19 page on
# beta and on 10 of 10 on hgw0, and the number differs per machine. A script that only asked
# for its absence would pass on an unfixed build most of the time.
#
# What is deterministic is the SECOND read, and Lou Nassar's note of 2026-09-18 is where that
# came from. The uninitialised protein accession stops the page dead: it ends right after
# "Links to sequence:", with no Translated Protein link and no Genomic Sequence link, on
# every load. Measured 2026-09-20, same three URLs, hgwbeta against genome-test:
#
#     hg19 BRCA1   17,487 bytes  ->  27,026
#     hg38 BRCA1   17,656 bytes  ->  27,456
#     mm39 Trp53   17,484 bytes  ->  25,616
#
# So each page is asked for the two links that come AFTER the crash point, and the absence of
# the OMIM link rides along as the secondary check. "Links to sequence:" is asserted too, and
# it is deliberately NOT the discriminator: it is the last thing the broken page prints, so
# having it says the request reached the right page and stopped where the bug stops it.
#
# The hg19 page is loaded three times because the OMIM link is the stochastic half of this;
# one load of it says little. The other two assemblies are loaded once each: all three run
# the same branch, since no knownGene name on hg38, hg19 or mm39 contains NM_ and the
# database branch is the only other way through.
#
# The last step is the control, and it is the reason the OMIM check can be a bare noHas on
# the link. A RefSeq page's OMIM link is real, read from the database, and must still be
# there -- so a "fix" that simply stopped printing OMIM links would fail here.
proof:
  - "release-ab 2026-09-20 -- fails on hgwbeta (v503) and passes on genome-test (v504). All three knownGene pages stop after 'Links to sequence:' on beta and carry neither link; the byte counts are in the header above"
  - "assertion-only 2026-09-20 -- written from #38317, a1c0911798f and Lou Nassar's 2026-09-18 note, which is what identified the truncation as the deterministic half of this bug"

target: genome-test
db: hg19
reset: true
fast: true
steps:
  # hg19 BRCA1, three times. The truncation is the same every load; the OMIM link is not.
  - goto: "/cgi-bin/hgc?db=hg19&g=knownGene&i=ENST00000634433.3_9&c=chr17&o=41196308&t=41322262&l=41196308&r=41322262"
  - expect:
      text: ["Links to sequence:", "Translated Protein from predicted mRNA", "Genomic Sequence from assembly"]
      noHas: 'a[href*="db=OMIM"]'

  - goto: "/cgi-bin/hgc?db=hg19&g=knownGene&i=ENST00000634433.3_9&c=chr17&o=41196308&t=41322262&l=41196308&r=41322262"
  - expect:
      text: ["Translated Protein from predicted mRNA", "Genomic Sequence from assembly"]
      noHas: 'a[href*="db=OMIM"]'

  - goto: "/cgi-bin/hgc?db=hg19&g=knownGene&i=ENST00000634433.3_9&c=chr17&o=41196308&t=41322262&l=41196308&r=41322262"
  - expect:
      text: ["Translated Protein from predicted mRNA", "Genomic Sequence from assembly"]
      noHas: 'a[href*="db=OMIM"]'

  # hg38 BRCA1.
  - goto: "/cgi-bin/hgc?db=hg38&g=knownGene&i=ENST00000634433.3&c=chr17&o=43044291&t=43170245&l=43044291&r=43170245"
  - expect:
      text: ["Links to sequence:", "Translated Protein from predicted mRNA", "Genomic Sequence from assembly"]
      noHas: 'a[href*="db=OMIM"]'

  # mm39 Trp53.
  - goto: "/cgi-bin/hgc?db=mm39&g=knownGene&i=ENSMUST00000501444.1&c=chr11&o=69469668&t=69482701&l=69469668&r=69482701"
  - expect:
      text: ["Links to sequence:", "Translated Protein from predicted mRNA", "Genomic Sequence from assembly"]
      noHas: 'a[href*="db=OMIM"]'

  # The control: a RefSeq page, where the OMIM link is real and comes from the database.
  - goto: "/cgi-bin/hgc?db=hg38&g=refGene&i=NM_000299&c=chr1&o=201283451&t=201332993&l=201283451&r=201332993"
  - expect:
      text: "601975"
      has: 'a[href*="db=OMIM&term=601975"]'
