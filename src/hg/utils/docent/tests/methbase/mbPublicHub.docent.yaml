# MethBase2 reached the way a user reaches it: My Data -> Track Hubs -> Public Hubs,
# search, Connect, Open on hg38.
#
# The other nine scripts here attach the hub by URL, which is quick and silent.  This one
# is the only one that goes through hgHubConnect, so it is the only one that says the RR's
# public hub list still carries MethBase2 -- a row in hgcentral.hubPublic, nothing to do
# with the hub answering.  A user who never types a URL sees MethBase only through this
# page.  It costs about a minute, mostly the Public Hubs search itself; the rest of the
# directory runs in ten to twenty seconds a script.
#
# `match: MethBase2` and not `MethBase`, because the search returns two rows this suite
# cares about: `MethBase2` and `MethBase (Legacy)` (mbLegacy).  The docent README warns
# against a version number in `match:` -- a hub relabels itself and the match rots.  The 2
# here is part of the hub's name, not a release of it, but that is a judgement and it can
# be wrong: if the smithlab hub is ever renamed, this is the script that says so, and it
# says it by failing the `expect:` below rather than by connecting the wrong hub.
#
# That `expect:` is the whole point of the last step.  `addPublicHub:` only WARNS when no
# row matches: it stops, the run carries on, the page renders whatever was already there
# and the exit code is 0.  So the connect has to be checked by looking for the hub's rows.

target: rr
db: hg38
position: chr15:24950000-24960000
reset: true
fast: true
steps:
  - go: chr15:24950000-24960000
  - hide: all
  - addPublicHub: {search: "MethBase", match: "MethBase2", db: hg38}
  - go: chr15:24950000-24960000

  # The hub really connected: four of its rows are on the page, from both of the two
  # composites the hub turns on for itself.  The `noRows:` half is what makes this more
  # than "something got drawn" -- the three views MethBase hides stay hidden through the
  # UI path as well as through the URL one.
  - expect:
      rows: [asm, cpgs, SRP007400_SRX081759_sym, SRP008144_SRX096518_HMR]
      noRows: [SRP007400_SRX081759_AMR, SRP007400_SRX081759_PMD,
               SRP007400_SRX081759_coverage, DRP001914_DRX015008_sym]
      noText: "Too Long"
